name: push-s0
out_dir: runs
env:
  physics:
    timestep: 0.002
    substeps: 20
    gravity: 9.81
    integrator: implicitfast
    cone: elliptic
    impratio: 10.0
    noslip_iterations: 0
    table_friction:
    - 0.5
    - 0.005
    - 0.0001
    object_friction:
    - 0.6
    - 0.01
    - 0.0005
    pad_friction: 1.0
    object_mass: 0.08
    object_half_size: 0.02
    object_condim: 4
    solref:
    - 0.01
    - 1.0
    pad_solref:
    - 0.01
    - 1.0
    solimp:
    - 0.95
    - 0.99
    - 0.001
    arm_joint_damping: 2.0
    arm_frictionloss: 0.1
    arm_gravity_comp: true
    servo_damping_scale: 0.25
    servo_lead_gain: 0.0
    randomize:
      enabled: true
      friction_scale:
      - 0.7
      - 1.3
      mass_scale:
      - 0.7
      - 1.4
      damping_scale:
      - 0.7
      - 1.5
      kp_scale:
      - 0.85
      - 1.15
      action_noise: 0.0
  scene:
    tray: false
    distractors: 0
    tray_center:
    - 0.0
    - 0.3
    tray_half_extent:
    - 0.09
    - 0.09
    tray_wall_height: 0.03
    camera_default: front
    workspace_center:
    - 0.5
    - 0.0
  task:
    name: push
    horizon: 60
    success_threshold: 0.04
    reward: sparse
    shaping: 0.0
    max_ee_step: 0.025
    workspace_half_extent:
    - 0.25
    - 0.3
    workspace_z:
    - 0.012
    - 0.32
    push_height: 0.02
    goal_height_max: 0.18
    air_goal_prob: 0.0
    object_start_extent: 0.12
    min_goal_distance: 0.06
  seed: 0
algo:
  critic: tqc
  hidden:
  - 256
  - 256
  - 256
  critic_ensemble: 5
  n_quantiles: 25
  top_quantiles_to_drop: 2
  layer_norm: true
  gamma: 0.98
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  init_alpha: 0.2
  target_entropy_scale: 1.0
  batch_size: 1024
  updates_per_step: 0.5
  grad_clip: 10.0
  her_prob: 0.8
  clip_return: true
  obs_clip: 5.0
  action_l2: 0.0
train:
  total_steps: 200000
  num_envs: 4
  start_steps: 5000
  warmup_updates_after: 2000
  buffer_episodes: 26000
  eval_every: 25000
  eval_episodes: 20
  log_every: 5000
  checkpoint_every: 100000
  milestones:
  - 0.0
  - 0.02
  - 0.1
  - 0.35
  - 1.0
  device: auto
  seed: 0
  curriculum:
    enabled: true
    start_scale: 0.35
    end_scale: 1.0
    promote_success: 0.7
    demote_success: 0.2
    step: 0.1
    window_episodes: 200
  demos:
    episodes: 400
    bc_steps: 4000
    bc_batch_size: 512
    keep_only_successful: true
    noise_std: 0.1
  vec_backend: subprocess
  save_buffer: true
  resume_refill_episodes: 400
