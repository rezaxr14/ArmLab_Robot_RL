name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ------------------------------------------------------------------ new package
  armforge:
    name: armforge (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries for headless MuJoCo rendering
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev libgl1 libglew-dev

      - name: Install (CPU torch keeps the job small)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      # Style is advisory: this code base has not been through ruff yet.
      - name: Ruff lint (advisory)
        continue-on-error: true
        run: python -m ruff check src tests

      - name: Environment check (mujoco, torch, Menagerie download, rendering)
        run: armforge doctor

      - name: Tests (config, scene composition, kinematics, simulator, RL, notebook, README)
        run: python -m pytest -rs

      - name: Smoke-train end to end (CPU, a few hundred steps)
        run: |
          armforge train --config configs/smoke.yaml --name ci-smoke --out-dir "$RUNNER_TEMP/runs" \
            --set train.total_steps=600 train.eval_every=300 train.log_every=100 train.checkpoint_every=300 train.start_steps=100 train.warmup_updates_after=100
          test -f "$RUNNER_TEMP/runs/ci-smoke/final.pt"

  # ------------------------------------------------------------------ legacy project (moved to legacy/)
  legacy-base:
    name: legacy base (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: legacy/pyproject.toml
      - name: Install base + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff format check
        run: python -m ruff format --check src tests
      - name: Pytest with coverage
        run: python -m pytest --cov=armlab --cov-report=term-missing
      - name: CLI help and doctor smoke tests
        run: |
          python -m armlab --help
          python -m armlab demo --help
          python -m armlab train --help
          python -m armlab doctor

  legacy-rl:
    name: legacy rl extra (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legacy/pyproject.toml
      - name: Install base + RL + dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[rl,dev]"
      - name: RL tests
        run: python -m pytest tests/test_rl_agent.py tests/test_rl_training.py tests/test_sac.py -q
      - name: DQN tiny training + checkpoint smoke test
        run: |
          python -m armlab train dqn --episodes 2 --max-steps 120 \
            --device cpu --eval-every 1 --eval-seed 11 --seed 11 \
            --output-dir "$RUNNER_TEMP/dqn-smoke"

  legacy-physics:
    name: legacy physics extra (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legacy/pyproject.toml
      - name: Install base + physics + dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[physics,dev]"
      - name: MuJoCo model, kinematics agreement, contacts
        run: python -m pytest tests/test_physics.py -q
      - name: Headless physics demo
        run: python -m armlab demo physics --headless --steps 20
