[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armforge"
version = "1.0.0"
description = "ArmForge: a native MuJoCo UR5e + Robotiq 2F-85 tabletop manipulation lab with GPU-accelerated SAC/TQC + HER training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "mujoco>=3.1",
    "torch>=2.1",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "pillow>=10.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]
notebook = [
    "pandas>=2.0",
    "ipython>=8.0",
    "jupyter>=1.0",
]

[project.scripts]
armforge = "armforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "mujoco: needs the mujoco package and the Menagerie assets (network on first run)",
    "torch: needs PyTorch",
    "render: needs an OpenGL backend (MUJOCO_GL=egl or osmesa)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]
