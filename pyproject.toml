[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armlab"
version = "0.1.0"
description = "ArmLab: a reproducible robotics control, simulation, and RL benchmark for a 3-link spatial arm."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
rl = ["torch>=2.0"]
physics = ["mujoco>=3.0"]
dashboard = ["dash>=2.14", "plotly>=5.18"]
dev = ["pytest>=7.4", "torch>=2.0"]

[project.scripts]
armlab = "armlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
