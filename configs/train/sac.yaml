# Soft Actor-Critic (Stable-Baselines3) on the continuous-action task.
# Smoke: python -m armlab train sac --config configs/train/sac.yaml --total-timesteps 2000
seed: 7
env_id: ArmLabKinematicContinuous-v0
total_timesteps: 50000
output_dir: results
eval_every: 5000
eval_episodes: 10
deterministic_eval: true

sac:
  learning_rate: 0.0003
  buffer_size: 200000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  learning_starts: 1000
  train_freq: 1
  gradient_steps: 1
  net_arch: [256, 256]
