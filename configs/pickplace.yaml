# Grasp, lift and place a cube (table / air goals). Scripted demonstrations bootstrap the first grasps.
name: pickplace
out_dir: runs
env:
  seed: 0
  task: {name: pickplace, horizon: 80, success_threshold: 0.03, air_goal_prob: 0.3, shaping: 0.0}
  physics:
    randomize: {enabled: true}
train:
  total_steps: 200000
  num_envs: 4
  buffer_episodes: 32000
  eval_every: 25000
  log_every: 5000
  milestones: [0.0, 0.02, 0.1, 0.35, 1.0]
  # The scripted expert solves this task ~100%; a larger, well-cloned demo set gives the
  # policy a strong starting point, so the RL phase mainly refines it with HER.
  demos: {episodes: 800, bc_steps: 8000}
