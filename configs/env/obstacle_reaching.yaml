# Static reaching with spherical obstacles (kinematic collision checking).
scenario: collision_avoidance
control_mode: continuous
action_step_size: 0.08726646259971647
continuous_action_scale: 0.08726646259971647
max_episode_steps: 300
action_repeat: 1
target_min_radius: 6.0
target_max_radius: 15.0
target_min_height: 5.0
target_max_height: 20.0
observation_kind: joint_ee_target

reward:
  distance_penalty_scale: 0.1
  success_bonus: 100.0
  success_threshold: 1.0
  time_penalty: 0.0
  action_penalty: 0.0
  success_terminates: true

obstacles:
  - type: sphere
    center: [9.0, 1.0, 12.0]
    radius: 1.5
  - type: sphere
    center: [11.0, -2.0, 10.0]
    radius: 2.0
link_radius: 0.3
